services:
  - type: pserv
    name: quadra-db
    runtime: image
    plan: starter
    image:
      url: docker.io/mysql:8.0
    disk:
      name: quadra-db-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: society_db
      - key: MYSQL_USER
        value: society_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: TZ
        value: America/Sao_Paulo

  - type: web
    name: quadra-show-de-bola
    runtime: node
    plan: starter
    buildCommand: npm ci --prefix backend
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DB_HOST
        fromService:
          type: pserv
          name: quadra-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        fromService:
          type: pserv
          name: quadra-db
          envVarKey: MYSQL_DATABASE
      - key: DB_USER
        fromService:
          type: pserv
          name: quadra-db
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: quadra-db
          envVarKey: MYSQL_PASSWORD

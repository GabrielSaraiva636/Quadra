version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: quadra_mysql
    restart: always
    env_file:
      - ../.env.production
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - quadra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: quadra_app
    restart: always
    env_file:
      - ../.env.production
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "80:3000"

volumes:
  quadra_mysql_data:
